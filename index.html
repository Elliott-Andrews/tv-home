* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  cursor: default;
}

#canvasRoot {
  position: absolute;
  left: 0;
  top: 0;
  width: 1920px;
  height: 1080px;
  transform-origin: 0 0;
  overflow: hidden;
  background: #000;
}

/* ---- ambient glow ---------------------------------------------------------------------------- */

.ambient {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 600ms ease;
  pointer-events: none;
}

/* ---- top shelf ------------------------------------------------------------------------------- */

#hero {
  position: absolute;
  left: 136px;
  font-size: 96px;
  font-weight: 300;
  letter-spacing: -0.02em;
  line-height: 1;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 260ms ease, transform 200ms ease;
  pointer-events: none;
}

/* ---- header ---------------------------------------------------------------------------------- */

header {
  position: absolute;
  top: 52px;
  left: 112px;
  right: 112px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  z-index: 3;
  transition: opacity 300ms ease, transform 360ms cubic-bezier(0.25, 0.8, 0.3, 1);
}

body.scrolled header {
  opacity: 0;
  transform: translateY(-48px);
  pointer-events: none;
}

#greeting {
  margin-left: 8px;
  color: rgba(255, 255, 255, 0.55);
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

#timeRow { display: flex; align-items: flex-end; }

#clock {
  font-size: 104px;
  font-weight: 300;
  letter-spacing: -0.04em;
  line-height: 1;
}

#ampm {
  margin: 0 0 16px 12px;
  color: rgba(255, 255, 255, 0.7);
  font-size: 30px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.divider {
  width: 2px;
  height: 52px;
  margin: 0 32px 16px;
  background: rgba(255, 255, 255, 0.2);
}

#date {
  margin-bottom: 18px;
  color: rgba(255, 255, 255, 0.65);
  font-size: 28px;
  font-weight: 400;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  white-space: pre;
}

#topButtons { display: flex; margin-bottom: 12px; }

.pill {
  display: flex;
  align-items: center;
  height: 84px;
  margin-left: 20px;
  padding: 0 40px 0 32px;
  border-radius: 42px;
  border: 2px solid rgba(255, 255, 255, 0.22);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
  color: #fff;
  font-size: 30px;
  font-weight: 500;
  letter-spacing: 0.01em;
  white-space: nowrap;
  cursor: pointer;
  transition: background 160ms ease, color 160ms ease, transform 200ms ease;
}

.pill svg { width: 44px; height: 44px; margin-right: 18px; fill: currentColor; }

.pill.focused {
  background: rgba(255, 255, 255, 0.96);
  border-color: transparent;
  color: #000;
  transform: scale(1.04);
}

/* ---- grid ------------------------------------------------------------------------------------ */

#viewport {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

#stage {
  position: absolute;
  inset: 0;
  transition: transform 420ms cubic-bezier(0.25, 0.8, 0.3, 1);
}

#dockBand {
  position: absolute;
  border-radius: 52px;
  background: #141416;
  border: 2px solid rgba(255, 255, 255, 0.12);
}

.item {
  position: absolute;
  width: 360px;
  opacity: 0;
  cursor: pointer;
  transform: translateY(24px);
  transition: opacity 400ms ease, transform 400ms cubic-bezier(0.2, 0.8, 0.3, 1),
    left 320ms cubic-bezier(0.25, 0.8, 0.3, 1), top 320ms cubic-bezier(0.25, 0.8, 0.3, 1);
}

.item.shown { opacity: 1; transform: none; }

.item.dock .name { display: none; }

.item.moving { z-index: 2; }

.item.moving .card {
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
  animation: wiggle 240ms ease-in-out infinite alternate;
}

@keyframes wiggle {
  from { transform: scale(1.1) rotate(-1.2deg); }
  to { transform: scale(1.1) rotate(1.2deg); }
}

body.editing #glass { opacity: 0 !important; }

.card {
  position: relative;
  width: 360px;
  height: 202px;
  border-radius: 32px;
  overflow: hidden;
  background: #1c1c1e;
  transition: transform 180ms ease;
}

.card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 32px;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.1);
}

.item.focused .card {
  transform: scale(1.1);
  transition: transform 260ms cubic-bezier(0.34, 1.6, 0.5, 1);
}

.card img {
  position: absolute;
  top: 0;
  left: 50%;
  height: 100%;
  transform: translateX(-50%);
}

.card.glyph img {
  top: 50%;
  height: 62%;
  transform: translate(-50%, -50%);
}

.name {
  height: 44px;
  margin-top: 14px;
  color: rgba(255, 255, 255, 0.95);
  font-size: 28px;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0;
  transform: translateY(-12px);
  transition: opacity 220ms ease, transform 220ms ease;
}

.item.focused .name { opacity: 1; transform: translateY(8px); }

#glass {
  position: absolute;
  left: 0;
  top: 0;
  border-radius: 47px;
  border: 3px solid rgba(255, 255, 255, 0.8);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.07));
  box-shadow: 0 0 4px 2px rgba(255, 255, 255, 0.19), 0 0 12px 4px rgba(255, 255, 255, 0.08);
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transition: opacity 180ms ease, transform 520ms cubic-bezier(0.3, 1.35, 0.45, 1);
}

#glass::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 45%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0));
}

/* ---- inputs dropdown ------------------------------------------------------------------------- */

#inputsPanel {
  position: absolute;
  z-index: 5;
  padding: 16px;
  border-radius: 40px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  background: linear-gradient(180deg, rgba(42, 42, 46, 0.95), rgba(22, 22, 24, 0.96));
  transform-origin: top;
  transition: opacity 220ms ease, transform 220ms cubic-bezier(0.2, 0.8, 0.3, 1);
}

#inputsPanel.hidden { opacity: 0; transform: translateY(-16px) scaleY(0.92); pointer-events: none; }

.inputRow {
  display: flex;
  align-items: center;
  height: 84px;
  padding: 0 24px;
  border-radius: 24px;
  font-size: 30px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
}

.inputRow svg { width: 40px; height: 40px; margin-right: 20px; fill: currentColor; }

.inputRow.focused { background: rgba(255, 255, 255, 0.96); color: #000; }

.separator { height: 2px; margin: 12px 24px; background: rgba(255, 255, 255, 0.12); }

/* ---- toast ----------------------------------------------------------------------------------- */

#toast {
  position: absolute;
  left: 50%;
  bottom: 80px;
  padding: 20px 40px;
  border-radius: 40px;
  background: rgba(40, 40, 44, 0.95);
  font-size: 28px;
  opacity: 0;
  transform: translateX(-50%);
  transition: opacity 200ms ease;
  z-index: 6;
}

#toast.shown { opacity: 1; }
</style>
</head>

  <script>/*
 * CleanYourTV (vidaa-vibehack): Apple TV 4K style home screen for Hisense VIDAA OS.
 * Ported from Gathin23/cleanyourtv & OmkarK97/webos-vibehack, wired to Hisense mTLS MQTT.
 */
(function () {
  "use strict";

  var COLUMNS = Math.max(1, CONFIG.columns || 4);
  var TILE_W = 360,
    TILE_H = 202;
  var CELL_W = (1920 - 2 * 112) / COLUMNS;
  var ROW_PITCH = 292;
  var DOCK_TOP = 708;
  var DOCK_GAP = 36;
  var FOCUS_SCALE = 1.1;
  var GLASS_PAD = 12;
  var VIEW_TOP = 80,
    VIEW_BOTTOM = 1060;

  var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, OK: 13, BACK: 461, ESC: 27, BS: 8 };

  var GREETINGS = [
    [5, "Good night"],
    [12, "Good morning"],
    [17, "Good afternoon"],
    [22, "Good evening"],
    [24, "Good night"],
  ];
  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTHS = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December",
  ];

  var ICON_INPUT =
    "M18,7V4c0,-1.1 -0.9,-2 -2,-2H8C6.9,2 6,2.9 6,4v3H5v6l3,6v3h8v-3l3,-6V7H18zM8,4h8v3h-2V5h-1v2h-2V5h-1v2H8V4z";
  var ICON_LIVETV =
    "M21,6h-7.59l3.29,-3.29L16,2l-4,4l-4,-4l-0.71,0.71L10.59,6H3c-1.1,0 -2,0.89 -2,2v12c0,1.1 0.9,2 2,2h18c1.1,0 2,-0.89 2,-2V8C23,6.89 22.1,6 21,6zM21,20H3V8h18V20zM9,10v8l7,-4L9,10z";

  var $ = function (id) {
    return document.getElementById(id);
  };
  var canvasRoot = $("canvasRoot");
  var stage = $("stage"),
    tilesEl = $("tiles"),
    glass = $("glass"),
    hero = $("hero");
  var ambients = [$("ambientA"), $("ambientB")],
    ambientFront = 0,
    ambientColor = null;
  var pills = [$("btnInputs"), $("btnWifi"), $("btnSettings")];
  var panel = $("inputsPanel");

  var items = [];
  var zone = "grid";
  var focused = 0,
    pillFocus = 0,
    inputFocus = 0,
    inputRows = [];
  var offset = 0,
    heroShown = false,
    glassShown = false;
  var editing = null;

  // Responsive viewport scaling so 1920x1080 fits 1280x720 (Odin browser), 1080p, 4K, or mobile preview
  function fitViewport() {
    var w = window.innerWidth || 1920;
    var h = window.innerHeight || 1080;
    var scale = Math.min(w / 1920, h / 1080);
    var tx = Math.max(0, (w - 1920 * scale) / 2);
    var ty = Math.max(0, (h - 1080 * scale) / 2);
    canvasRoot.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
  }
  window.addEventListener("resize", fitViewport);
  fitViewport();

  // ---- VIDAA Native Odin C++ Bridge + MQTT API Fallback --------------------------------------

  function apiPost(url, payload, cb) {
    if (window.location.protocol === "https:") {
      if (cb) cb({ ok: true });
      return;
    }
    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload || {}),
    })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (cb) cb(res); })
      .catch(function (err) { if (cb) cb({ ok: false, message: String(err) }); });
  }

  /* Diagnostic probe stripped for production standalone build */

  function nativeSendPlatformMessage(msgObj) {
    try {
      var fn =
        (window.omi_platform && window.omi_platform.sendPlatformMessage) ||
        (window.opera_omi && window.opera_omi.sendPlatformMessage);
      if (typeof fn === "function") {
        fn.call(window.omi_platform || window.opera_omi, JSON.stringify(msgObj));
        return true;
      }
    } catch (e) {}
    return false;
  }

  function launchApp(app) {
    toast("Opening " + app.title + "…");
    // 1. Try 100% on-TV native Odin C++ bridge (works even without PC!)
    var usedNative = nativeSendPlatformMessage({
      type: "APPMessage",
      MsgType: "appControl",
      action: "startThirdApp",
      startAppType: 1,
      source: "browser",
      param: {
        appName: "vidaa-home-os",
        startFrom: "1",
        startFromURL: window.location.href,
        third_appName: app.title || "tvbrowser",
        deep_linking: app.url,
        third_appId: String(app.id),
        storeType: Number(app.storeType || 99),
      },
    });
    // 2. Also notify PC server if reachable
    apiPost(
      "/api/launch",
      {
        appId: app.id,
        name: app.title,
        url: app.url,
        storeType: app.storeType || 99,
        usedNative: usedNative,
      },
      function () {}
    );
  }

  function switchSource(sourceId, label) {
    toast("Switching to " + label + "…");
    apiPost("/api/source", { sourceId: sourceId, sourceName: sourceId }, function (res) {
      if (!res || !res.ok) toast("Could not switch to " + label);
    });
  }

  function openTvSettings(mode) {
    toast(mode === "network" ? "Opening Network Settings…" : "Opening TV Settings…");
    apiPost("/api/key", { key: "KEY_MENU" });
  }

  var toastTimer;
  function toast(text) {
    var t = $("toast");
    t.textContent = text;
    t.classList.add("shown");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      t.classList.remove("shown");
    }, 2200);
  }

  // ---- apps ----------------------------------------------------------------------------------

  function orderedApps() {
    var all = (window.TV_APPS && TV_APPS.apps) || [];
    var byId = {};
    all.forEach(function (a) {
      byId[a.id] = a;
    });
    var hidden = {};
    (CONFIG.hiddenApps || []).forEach(function (id) {
      hidden[id] = true;
    });

    var saved = loadOrder();
    if (saved) {
      var placed = [];
      saved.forEach(function (id) {
        if (byId[id] && !hidden[id]) {
          placed.push(byId[id]);
          hidden[id] = true;
        }
      });
      return placed.concat(
        all.filter(function (a) {
          return !hidden[a.id];
        })
      );
    }

    var dock = [];
    (CONFIG.dockApps || []).forEach(function (id) {
      if (byId[id] && !hidden[id] && dock.length < COLUMNS) {
        dock.push(byId[id]);
        hidden[id] = true;
      }
    });
    var rest = all.filter(function (a) {
      return !hidden[a.id];
    });
    return dock.concat(rest);
  }

  var ORDER_KEY = "tvhome.vidaa.order";

  function loadOrder() {
    try {
      var s = JSON.parse(localStorage.getItem(ORDER_KEY));
      return s && s.dock === (CONFIG.dockApps || []).join(",") ? s.ids : null;
    } catch (e) {
      return null;
    }
  }

  function saveOrder() {
    try {
      localStorage.setItem(
        ORDER_KEY,
        JSON.stringify({
          dock: (CONFIG.dockApps || []).join(","),
          ids: items.map(function (it) {
            return it.app.id;
          }),
        })
      );
    } catch (e) {}
  }

  function rowOf(i) {
    return Math.floor(i / COLUMNS);
  }
  function tileLeft(i) {
    return 112 + (i % COLUMNS) * CELL_W + (CELL_W - TILE_W) / 2;
  }
  function tileTop(i) {
    var r = rowOf(i);
    return DOCK_TOP + r * ROW_PITCH + (r > 0 ? DOCK_GAP : 0);
  }

  function build() {
    tilesEl.innerHTML = "";
    items = orderedApps().map(function (app) {
      var el = document.createElement("div");
      el.className = "item";
      var card = document.createElement("div");
      card.className = "card";
      var img = document.createElement("img");
      var item = { app: app, el: el, card: card, color: parseColor(app.iconColor) };
      img.onload = function () {
        paintTile(item, img);
      };
      if (app.icon) {
        img.src = app.icon;
      } else {
        card.style.background = glyphBackground(app.iconColor);
      }
      card.appendChild(img);
      el.appendChild(card);
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = app.title;
      el.appendChild(name);
      el.addEventListener("mouseover", function () {
        if (zone !== "inputs" && !editing) focusTile(items.indexOf(item));
      });
      el.addEventListener("click", function () {
        if (editing) finishEdit(true);
        else launchApp(app);
      });
      tilesEl.appendChild(el);
      return item;
    });
    layout();
  }

  function layout() {
    items.forEach(function (it, i) {
      it.el.style.left = tileLeft(i) + "px";
      it.el.style.top = tileTop(i) + "px";
      it.el.classList.toggle("dock", rowOf(i) === 0);
    });

    var band = $("dockBand");
    var n = Math.min(COLUMNS, items.length);
    band.style.display = n ? "block" : "none";
    band.style.left = tileLeft(0) - 28 + "px";
    band.style.top = DOCK_TOP - 28 + "px";
    band.style.width = (n - 1) * CELL_W + TILE_W + 56 + "px";
    band.style.height = TILE_H + 56 + "px";
  }

  function animateIn() {
    items.forEach(function (it, i) {
      it.el.classList.remove("shown");
      setTimeout(function () {
        it.el.classList.add("shown");
      }, 60 + Math.min(i, 16) * 40);
    });
  }

  function paintTile(item, img) {
    var px = null,
      edge = null;
    try {
      var c = document.createElement("canvas");
      c.width = 12;
      c.height = 12;
      var g = c.getContext("2d");
      g.drawImage(img, 0, 0, 12, 12);
      px = g.getImageData(0, 0, 12, 12).data;
      edge = edgeColor(img);
    } catch (e) {}

    var glyphColor = null;
    if (edge && edge[3] > 200) {
      item.card.style.background = "rgb(" + edge[0] + "," + edge[1] + "," + edge[2] + ")";
    } else {
      item.card.classList.add("glyph");
      item.card.style.background = glyphBackground(item.app.iconColor);
      glyphColor =
        glyphBackground(item.app.iconColor) === "#2c2c2e" ? null : parseColor(item.app.iconColor);
    }
    item.color = glyphColor || (px ? vividColor(px) : parseColor(item.app.iconColor));
    if (items[focused] === item) setAmbient(item.color);
  }

  function edgeColor(img) {
    var w = img.naturalWidth,
      h = img.naturalHeight;
    var c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    var g = c.getContext("2d");
    g.drawImage(img, 0, 0);
    var corner = g.getImageData(2, 2, 1, 1).data;
    return corner[3] > 200 ? corner : g.getImageData(2, Math.floor(h / 2), 1, 1).data;
  }

  function glyphBackground(hex) {
    var c = parseColor(hex);
    if (!c) return "#2c2c2e";
    var hsv = rgbToHsv(c);
    if (hsv[1] < 0.15 && (hsv[2] > 0.85 || hsv[2] < 0.1)) return "#2c2c2e";
    return "rgb(" + c.join(",") + ")";
  }

  function vividColor(px) {
    var best = null,
      bestScore = -1,
      sum = [0, 0, 0],
      n = 0;
    for (var i = 0; i < px.length; i += 4) {
      if (px[i + 3] < 128) continue;
      var p = [px[i], px[i + 1], px[i + 2]];
      sum[0] += p[0];
      sum[1] += p[1];
      sum[2] += p[2];
      n++;
      var hsv = rgbToHsv(p);
      var score = hsv[1] * Math.min(1, hsv[2] * 1.4);
      if (score > bestScore) {
        bestScore = score;
        best = p;
      }
    }
    if (!n) return [68, 68, 68];
    if (bestScore < 0.25) {
      var avg = rgbToHsv([sum[0] / n, sum[1] / n, sum[2] / n]);
      avg[2] = Math.max(avg[2], 0.55);
      return hsvToRgb(avg);
    }
    var h = rgbToHsv(best);
    h[1] = Math.min(1, h[1] * 1.1);
    h[2] = Math.max(0.5, h[2]);
    return hsvToRgb(h);
  }

  function parseColor(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return null;
    var v = parseInt(m[1], 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  function rgbToHsv(c) {
    var r = c[0] / 255,
      g = c[1] / 255,
      b = c[2] / 255;
    var max = Math.max(r, g, b),
      min = Math.min(r, g, b),
      d = max - min,
      h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return [h, max ? d / max : 0, max];
  }

  function hsvToRgb(hsv) {
    var h = hsv[0],
      s = hsv[1],
      v = hsv[2];
    var c = v * s,
      x = c * (1 - Math.abs(((h / 60) % 2) - 1)),
      m = v - c,
      rgb;
    if (h < 60) rgb = [c, x, 0];
    else if (h < 120) rgb = [x, c, 0];
    else if (h < 180) rgb = [0, c, x];
    else if (h < 240) rgb = [0, x, c];
    else if (h < 300) rgb = [x, 0, c];
    else rgb = [c, 0, x];
    return rgb.map(function (k) {
      return Math.round((k + m) * 255);
    });
  }

  // ---- focus & glass -------------------------------------------------------------------------

  function focusTile(i) {
    if (!items.length) return;
    i = Math.max(0, Math.min(i, items.length - 1));
    setZone("grid");
    if (items[focused]) items[focused].el.classList.remove("focused");
    focused = i;
    items[i].el.classList.add("focused");

    var top = tileTop(i),
      row = rowOf(i);
    if (row === 0) {
      offset = 0;
    } else {
      if (top - offset + TILE_H + 70 > VIEW_BOTTOM) offset = top + TILE_H + 70 - VIEW_BOTTOM;
      if (top - offset - 24 < VIEW_TOP) offset = top - 24 - VIEW_TOP;
    }
    stage.style.transform = "translateY(" + -offset + "px)";
    var header = document.querySelector("header");
    var headerBottom = header.offsetTop + header.offsetHeight;
    document.body.classList.toggle("scrolled", DOCK_TOP - 28 - offset < headerBottom + 24);

    var w = TILE_W * FOCUS_SCALE + 2 * GLASS_PAD,
      h = TILE_H * FOCUS_SCALE + 2 * GLASS_PAD;
    var x = tileLeft(i) + TILE_W / 2 - w / 2,
      y = top + TILE_H / 2 - h / 2;
    glass.style.width = w + "px";
    glass.style.height = h + "px";
    glass.style.transform = "translate(" + x + "px," + y + "px)";
    if (!glassShown) {
      glass.style.transition = "none";
      glass.offsetWidth;
      glass.style.transition = "";
      glass.style.opacity = "1";
      glassShown = true;
    }

    if (row === 0) showHero(items[i]);
    else hideHero();
    setAmbient(items[i].color);
  }

  function hideGlass() {
    glassShown = false;
    glass.style.opacity = "0";
  }

  function showHero(item) {
    var label = item.app.title;
    hero.style.top = DOCK_TOP - 28 - 52 - 96 + "px";
    if (!heroShown) {
      hero.textContent = label;
      hero.style.transform = "none";
      hero.style.opacity = "1";
      heroShown = true;
    } else if (hero.textContent !== label) {
      hero.style.opacity = "0";
      hero.style.transform = "translateX(-24px)";
      clearTimeout(hero.swap);
      hero.swap = setTimeout(function () {
        hero.textContent = label;
        hero.style.transition = "none";
        hero.style.transform = "translateX(24px)";
        hero.offsetWidth;
        hero.style.transition = "";
        hero.style.transform = "none";
        hero.style.opacity = "1";
      }, 120);
    }
    setAmbient(item.color);
  }

  function hideHero() {
    if (!heroShown) return;
    heroShown = false;
    hero.style.opacity = "0";
  }

  function setAmbient(color) {
    if (!color) return;
    var key = color.join(",");
    if (key === ambientColor) return;
    ambientColor = key;
    var back = ambients[1 - ambientFront];
    back.style.background =
      "radial-gradient(circle 1190px at 32% 42%, rgba(" +
      key +
      ",0.36) 0%, rgba(" +
      key +
      ",0.15) 50%, rgba(" +
      key +
      ",0) 100%)";
    back.style.opacity = "1";
    ambients[ambientFront].style.opacity = "0";
    ambientFront = 1 - ambientFront;
  }

  function focusPill(i) {
    setZone("top");
    document.body.classList.remove("scrolled");
    pills[pillFocus].classList.remove("focused");
    pillFocus = Math.max(0, Math.min(i, pills.length - 1));
    pills[pillFocus].classList.add("focused");
  }

  function setZone(z) {
    if (zone === z) return;
    if (zone === "top") pills[pillFocus].classList.remove("focused");
    if (zone === "grid") {
      if (items[focused]) items[focused].el.classList.remove("focused");
      hideGlass();
    }
    zone = z;
  }

  function pillAbove(i) {
    var cx = tileLeft(i) + TILE_W / 2,
      best = 0,
      bestD = Infinity;
    pills.forEach(function (p, k) {
      var left = p.offsetLeft + p.parentElement.offsetLeft + 112;
      var d = Math.abs(left + p.offsetWidth / 2 - cx);
      if (d < bestD) {
        bestD = d;
        best = k;
      }
    });
    return best;
  }

  // ---- top bar -------------------------------------------------------------------------------

  function updateClock() {
    var now = new Date(),
      h = now.getHours();
    for (var k = 0; k < GREETINGS.length; k++) {
      if (h < GREETINGS[k][0]) {
        $("greeting").textContent = GREETINGS[k][1];
        break;
      }
    }
    var m = now.getMinutes();
    $("clock").textContent = (h % 12 || 12) + ":" + (m < 10 ? "0" : "") + m;
    $("ampm").textContent = h < 12 ? "am" : "pm";
    $("date").textContent = DAYS[now.getDay()] + "  " + now.getDate() + " " + MONTHS[now.getMonth()];
  }

  function activatePill(i) {
    if (i === 0) showInputs();
    else if (i === 1) openTvSettings("network");
    else openTvSettings("settings");
  }

  // ---- inputs dropdown -----------------------------------------------------------------------

  function showInputs() {
    panel.innerHTML = "";
    inputRows = [];
    var inputs = (window.TV_APPS && TV_APPS.inputs) || [];
    inputs.forEach(function (inp) {
      var icon = inp.sourceId === "TV" ? ICON_LIVETV : ICON_INPUT;
      if (inp.sourceId === "TV" && inputRows.length) {
        panel.appendChild(Object.assign(document.createElement("div"), { className: "separator" }));
      }
      addInputRow(icon, inp.label, inp.sourceId);
    });
    if (!inputRows.length) {
      toast("No inputs found");
      return;
    }

    panel.style.left = "1160px";
    panel.style.top = "170px";
    panel.style.minWidth = "340px";
    panel.classList.remove("hidden");
    pills[pillFocus].classList.remove("focused");
    zone = "inputs";
    focusInput(0);
  }

  function addInputRow(icon, label, sourceId) {
    var row = document.createElement("div");
    row.className = "inputRow";
    row.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + icon + '"/></svg>';
    row.appendChild(document.createTextNode(label));
    var idx = inputRows.length;
    row.addEventListener("mouseover", function () {
      focusInput(idx);
    });
    row.addEventListener("click", function () {
      hideInputs();
      switchSource(sourceId, label);
    });
    row.sourceId = sourceId;
    row.label = label;
    inputRows.push(row);
    panel.appendChild(row);
  }

  function focusInput(i) {
    if (inputRows[inputFocus]) inputRows[inputFocus].classList.remove("focused");
    inputFocus = Math.max(0, Math.min(i, inputRows.length - 1));
    inputRows[inputFocus].classList.add("focused");
  }

  function hideInputs() {
    panel.classList.add("hidden");
    zone = "none";
    focusPill(0);
  }

  // ---- rearranging ---------------------------------------------------------------------------

  function startEdit() {
    var it = items[focused];
    if (!it) return;
    editing = { item: it, snapshot: items.slice() };
    it.el.classList.add("moving");
    document.body.classList.add("editing");
    toast("Arrows to move  ·  OK to place  ·  Back to cancel");
  }

  function moveTo(to) {
    if (to < 0 || to >= items.length || to === focused) return;
    items.splice(to, 0, items.splice(focused, 1)[0]);
    focused = to;
    layout();
    focusTile(to);
  }

  function finishEdit(keep) {
    var it = editing.item;
    if (!keep) {
      items = editing.snapshot;
      layout();
    }
    editing = null;
    it.el.classList.remove("moving");
    document.body.classList.remove("editing");
    if (keep) saveOrder();
    focused = items.indexOf(it);
    focusTile(focused);
  }

  // ---- navigation handler (both TV remote DOM keys & phone remote SSE events) ---------------

  function handleNavKey(k) {
    if (editing) {
      if (k === KEY.LEFT) moveTo(focused - 1);
      else if (k === KEY.RIGHT) moveTo(focused + 1);
      else if (k === KEY.UP) moveTo(focused - COLUMNS);
      else if (k === KEY.DOWN) moveTo(Math.min(focused + COLUMNS, items.length - 1));
      else if (k === KEY.OK) finishEdit(true);
      else if (k === KEY.BACK || k === KEY.ESC || k === KEY.BS) finishEdit(false);
      else return false;
      return true;
    }
    if (zone === "inputs") {
      if (k === KEY.UP) focusInput(inputFocus - 1);
      else if (k === KEY.DOWN) focusInput(inputFocus + 1);
      else if (k === KEY.OK) {
        var row = inputRows[inputFocus];
        hideInputs();
        switchSource(row.sourceId, row.label);
      } else if (k === KEY.BACK || k === KEY.ESC || k === KEY.BS || k === KEY.LEFT || k === KEY.RIGHT) {
        hideInputs();
      } else return false;
      return true;
    }
    if (zone === "top") {
      if (k === KEY.LEFT) focusPill(pillFocus - 1);
      else if (k === KEY.RIGHT) focusPill(pillFocus + 1);
      else if (k === KEY.DOWN) focusTile(rowOf(focused) === 0 ? focused : 0);
      else if (k === KEY.OK) activatePill(pillFocus);
      else return false;
      return true;
    }

    var col = focused % COLUMNS,
      last = items.length - 1;
    if (k === KEY.LEFT) {
      if (col > 0) focusTile(focused - 1);
    } else if (k === KEY.RIGHT) {
      if (col < COLUMNS - 1 && focused < last) focusTile(focused + 1);
    } else if (k === KEY.UP) {
      if (rowOf(focused) === 0) focusPill(pillAbove(focused));
      else focusTile(focused - COLUMNS);
    } else if (k === KEY.DOWN) {
      if (rowOf(focused) < rowOf(last)) focusTile(Math.min(focused + COLUMNS, last));
    } else if (k === KEY.OK) {
      var it = items[focused];
      if (it) launchApp(it.app);
    } else return false;
    return true;
  }

  var LONG_PRESS_MS = 600;
  var okDown = false,
    okTimer = null;

  document.addEventListener("keyup", function (e) {
    if (e.keyCode !== KEY.OK) return;
    okDown = false;
    if (!okTimer) return;
    clearTimeout(okTimer);
    okTimer = null;
    var it = items[focused];
    if (zone === "grid" && it && !editing) launchApp(it.app);
  });

  document.addEventListener("keydown", function (e) {
    var k = e.keyCode;
    if (k === KEY.OK && zone === "grid" && !editing) {
      if (okDown) {
        e.preventDefault();
        return;
      }
      okDown = true;
      okTimer = setTimeout(function () {
        okTimer = null;
        startEdit();
      }, LONG_PRESS_MS);
      e.preventDefault();
      return;
    }
    if (handleNavKey(k)) {
      e.preventDefault();
    }
  });

  // Subscribe to Server-Sent Events from phone_remote.js so phone remote arrows also drive the TV UI!
  try {
    if (window.location.protocol === "http:") { var es = new EventSource("/api/launcher-events");
    es.onmessage = function (ev) {
      try {
        var msg = JSON.parse(ev.data);
        if (msg.type === "nav") {
          var map = {
            KEY_LEFT: KEY.LEFT,
            KEY_RIGHT: KEY.RIGHT,
            KEY_UP: KEY.UP,
            KEY_DOWN: KEY.DOWN,
            KEY_OK: KEY.OK,
            KEY_BACK: KEY.BACK,
            KEY_RETURNS: KEY.BACK,
            KEY_EXIT: KEY.ESC,
          };
          if (map[msg.key]) handleNavKey(map[msg.key]);
        }
      } catch (e) {}
    }; }
  } catch (e) {}

  pills.forEach(function (p, i) {
    p.addEventListener("mouseover", function () {
      if (zone !== "inputs") focusPill(i);
    });
    p.addEventListener("click", function () {
      activatePill(i);
    });
  });

  build();
  updateClock();
  setInterval(updateClock, 10000);
  animateIn();
  zone = "none";
  focusTile(0);
})();
</script>
  <script>
  if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./sw.js').catch(function() {});
    });
  }
</script>
